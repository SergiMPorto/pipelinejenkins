services:
  jenkins:
    container_name: jenkins
    image: jenkins/docker
    build:
      context: pipeline
    ports:
      - "8092:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - net 
  remote_host:
    container_name: remote-host
    image: remote-host
    build:
      context: ./ubuntu
      dockerfile: Dockerfile
    tty: true
    restart: unless-stopped
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
    jenkins_home:
